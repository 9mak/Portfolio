<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Text Analyzer - テキスト分析ツール</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📝 AI Text Analyzer</h1>
            <p>AIによる高度なテキスト分析・インサイトツール</p>
        </header>

        <div class="card">
            <h2>デモモード</h2>
            <p>APIキーを入力せず、ブラウザ内の簡易ロジックで分析結果を表示します。</p>
        </div>

        <div class="card">
            <h2>テキスト入力</h2>
            <textarea id="text-input" placeholder="分析したいテキストを入力してください..." rows="10"></textarea>
            <div class="text-stats">
                <span>文字数: <strong id="char-count">0</strong></span>
                <span>語数: <strong id="word-count">0</strong></span>
            </div>
            <button class="btn btn-primary" id="analyze-btn">分析開始</button>
        </div>

        <div class="card" id="results" style="display: none;">
            <h2>分析結果</h2>
            <div class="result-grid">
                <div class="result-card">
                    <h3>感情分析</h3>
                    <div id="sentiment-result"></div>
                </div>
                <div class="result-card">
                    <h3>キーワード</h3>
                    <div id="keywords-result"></div>
                </div>
                <div class="result-card">
                    <h3>可読性</h3>
                    <div id="readability-result"></div>
                </div>
                <div class="result-card">
                    <h3>改善提案</h3>
                    <div id="suggestions-result"></div>
                </div>
            </div>
        </div>
    </div>
<section class="portfolio-context" style="max-width: 880px; margin: 32px auto; padding: 20px; border: 1px solid currentColor; background: rgba(255,255,255,.72); line-height: 1.8; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Noto Sans JP', sans-serif;">
  <h2 style="font-size: 1rem; margin: 0 0 10px;">提案用の見せ方</h2>
  <p style="margin: 0 0 8px;">文章の感情、キーワード、読みやすさをまとめて評価し、改善提案まで返す構成です。問い合わせ文、LP文、商品説明の改善提案サービスに転用できます。</p>
  <p style="margin: 0;">APIキーなしでも診断サンプルを見せ、実運用では社内文書を保存しないブラウザ完結型にできます。</p>
</section>
<script src="app.js"></script>
</body>
</html>
