<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Aggregator - ニュース集約ダッシュボード</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📰 News Aggregator</h1>
            <p>複数ソースからニュースを集約</p>
        </header>

        <div class="card api-card">
            <p>公開デモでは外部APIキーを扱わず、サンプルニュースで検索・カテゴリ・ブックマーク操作を確認できます。</p>
        </div>

        <div class="controls">
            <input type="text" id="search" placeholder="キーワード検索...">
            <select id="category">
                <option value="">全カテゴリ</option>
                <option value="technology">テクノロジー</option>
                <option value="business">ビジネス</option>
                <option value="entertainment">エンタメ</option>
                <option value="sports">スポーツ</option>
                <option value="science">科学</option>
                <option value="health">健康</option>
            </select>
            <button class="btn btn-primary" id="refresh-btn">更新</button>
        </div>

        <div class="tabs">
            <button class="tab-btn active" data-tab="news">最新ニュース</button>
            <button class="tab-btn" data-tab="bookmarks">ブックマーク</button>
        </div>

        <div class="tab-content active" id="news-tab">
            <div id="news-list" class="news-grid"></div>
        </div>

        <div class="tab-content" id="bookmarks-tab">
            <div id="bookmarks-list" class="news-grid"></div>
        </div>
    </div>
<section class="portfolio-context" style="max-width: 880px; margin: 32px auto; padding: 20px; border: 1px solid currentColor; background: rgba(255,255,255,.72); line-height: 1.8; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Noto Sans JP', sans-serif;">
  <h2 style="font-size: 1rem; margin: 0 0 10px;">提案用の見せ方</h2>
  <p style="margin: 0 0 8px;">複数カテゴリのニュースを検索、保存、絞り込みできるダッシュボードです。情報収集業務や業界ウォッチの効率化デモとして使えます。</p>
  <p style="margin: 0;">公開版はサンプルデータで体験でき、実運用ではRSSや社内メモとの連携に拡張できます。</p>
</section>
<script src="app.js"></script>
</body>
</html>
