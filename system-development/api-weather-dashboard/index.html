<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天気ダッシュボード | Weather Dashboard</title>
    <meta name="description" content="天気ダッシュボードの静的デモページ。主要機能、入力操作、結果表示まで確認できるシステム開発実績です。">
    <meta property="og:title" content="天気ダッシュボード">
    <meta property="og:description" content="天気ダッシュボードの静的デモページ。主要機能、入力操作、結果表示まで確認できるシステム開発実績です。">
    <meta property="og:type" content="website">
    <link rel="stylesheet" href="style.css">

    <style>
        /* Portfolio QA overflow guard */
        html, body { max-width: 100%; overflow-x: hidden; }
        img, svg, canvas, video { max-width: 100%; }
    </style>
</head>
<body id="top">
    <div class="app">
        <header class="header">
            <h1>⛅ 天気ダッシュボード</h1>
            <p class="subtitle">リアルタイム天気情報と5日間予報</p>
        </header>

        <main class="container">
            <section class="search-section">
                <div class="search-card">
                    <div class="search-form">
                        <input
                            type="text"
                            id="cityInput"
                            placeholder="都市名を入力（例: Tokyo, Osaka, New York）"
                            class="search-input"
                        >
                        <button id="searchBtn" class="btn btn-primary">
                            🔍 検索
                        </button>
                        <button id="geoBtn" class="btn btn-secondary">
                            📍 現在地
                        </button>
                    </div>
                    <div class="popular-cities">
                        <button class="city-btn" data-city="Tokyo">東京</button>
                        <button class="city-btn" data-city="Osaka">大阪</button>
                        <button class="city-btn" data-city="Kyoto">京都</button>
                        <button class="city-btn" data-city="Fukuoka">福岡</button>
                        <button class="city-btn" data-city="Sapporo">札幌</button>
                        <button class="city-btn" data-city="Okinawa">沖縄</button>
                    </div>
                </div>
            </section>

            <section id="currentWeather" class="current-weather" style="display: none;">
                <div class="current-card">
                    <div class="current-header">
                        <div class="location">
                            <h2 id="cityName">-</h2>
                            <p id="currentTime">-</p>
                        </div>
                        <div class="weather-icon-large">
                            <img id="weatherIcon" src="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 320 200%22%3E%3Crect width=%22320%22 height=%22200%22 fill=%22%23eef2f7%22/%3E%3Cpath d=%22M62 140h196L204 82l-38 42-24-28z%22 fill=%22%2394a3b8%22/%3E%3Ccircle cx=%22118%22 cy=%2272%22 r=%2222%22 fill=%22%23cbd5e1%22/%3E%3C/svg%3E" alt="Weather">
                        </div>
                    </div>

                    <div class="current-temp">
                        <span id="temperature">-</span>°C
                    </div>

                    <div class="current-desc">
                        <p id="weatherDescription">-</p>
                    </div>

                    <div class="current-details">
                        <div class="detail-item">
                            <span class="detail-icon">💧</span>
                            <div class="detail-content">
                                <span class="detail-label">湿度</span>
                                <span class="detail-value" id="humidity">-</span>
                            </div>
                        </div>
                        <div class="detail-item">
                            <span class="detail-icon">💨</span>
                            <div class="detail-content">
                                <span class="detail-label">風速</span>
                                <span class="detail-value" id="windSpeed">-</span>
                            </div>
                        </div>
                        <div class="detail-item">
                            <span class="detail-icon">🌡️</span>
                            <div class="detail-content">
                                <span class="detail-label">体感温度</span>
                                <span class="detail-value" id="feelsLike">-</span>
                            </div>
                        </div>
                        <div class="detail-item">
                            <span class="detail-icon">☁️</span>
                            <div class="detail-content">
                                <span class="detail-label">雲量</span>
                                <span class="detail-value" id="clouds">-</span>
                            </div>
                        </div>
                        <div class="detail-item">
                            <span class="detail-icon">🌅</span>
                            <div class="detail-content">
                                <span class="detail-label">日の出</span>
                                <span class="detail-value" id="sunrise">-</span>
                            </div>
                        </div>
                        <div class="detail-item">
                            <span class="detail-icon">🌇</span>
                            <div class="detail-content">
                                <span class="detail-label">日の入</span>
                                <span class="detail-value" id="sunset">-</span>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <section id="forecast" class="forecast-section" style="display: none;">
                <h2>5日間の天気予報</h2>
                <div id="forecastList" class="forecast-list"></div>
            </section>

            <section id="favorites" class="favorites-section">
                <div class="favorites-header">
                    <h3>📌 お気に入りの都市</h3>
                    <button id="addFavorite" class="btn-add" style="display: none;">
                        ➕ 追加
                    </button>
                </div>
                <div id="favoritesList" class="favorites-list">
                    <p class="empty-state">お気に入りの都市がありません</p>
                </div>
            </section>
        </main>
    </div>
<section class="portfolio-context" style="max-width: 880px; margin: 32px auto; padding: 20px; border: 1px solid currentColor; background: rgba(255,255,255,.72); line-height: 1.8; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Noto Sans JP', sans-serif;">
  <h2 style="font-size: 1rem; margin: 0 0 10px;">提案用の見せ方</h2>
  <p style="margin: 0 0 8px;">都市検索、現在地、予報、お気に入りをまとめた天気ダッシュボードです。外部API連携とローカル保存の基本構成を確認できます。</p>
  <p style="margin: 0;">店舗サイトの来店案内、イベント運営、配送判断など、天候条件が関係する業務画面へ展開できます。</p>
</section>
<script src="app.js"></script>
</body>
</html>
