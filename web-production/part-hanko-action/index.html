<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Hanko Action</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hina+Mincho&family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="paper-doc">
        <h2 class="text-xl font-bold mb-4 border-b pb-2">稟議書</h2>
        <div class="space-y-4 text-sm leading-relaxed text-gray-700">
            <p>件名：Webサイトリニューアルの件</p>
            <p>下記内容にて承認をお願い致します。</p>
            <p class="text-xs text-gray-400 mt-8">2025年1月20日 申請</p>
        </div>

        <div class="flex justify-end mt-8">
            <div class="text-center">
                <p class="text-xs text-gray-500 mb-1">承認印</p>
                <!-- ここをクリックして捺印 -->
                <div class="approval-area" onclick="stamp(this)">
                    <span class="approval-label">印</span>
                    <span class="btn-text">Click</span>
                    
                    <!-- 印影（最初は見えない） -->
                    <div class="hanko-mark">
                        <span>承</span>
                        <span>認</span>
                        <div class="text-[0.6rem] border-t border-[#d32f2f] w-full text-center mt-1 pt-0.5">田中</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
<section class="portfolio-context" style="max-width: 880px; margin: 32px auto; padding: 20px; border: 1px solid currentColor; background: rgba(255,255,255,.72); line-height: 1.8; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Noto Sans JP', sans-serif;">
  <h2 style="font-size: 1rem; margin: 0 0 10px;">承認・完了を印象づける捺印UI</h2>
  <p style="margin: 0 0 8px;">クリックで印影が押されるマイクロインタラクションです。申請、見積承認、フォーム送信完了などの状態変化を直感的に伝えます。</p>
  <p style="margin: 0;">押印者名、日付、承認ステータスを差し替え、業務アプリの確認画面や電子稟議デモに展開できます。</p>
</section>
<script src="script.js"></script>
</body>
</html>
