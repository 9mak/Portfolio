<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>迷宮古書店 積読 | 本の森を彷徨う</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="fixed top-0 left-0 p-6 z-40 mix-blend-difference text-white">
        <h1 class="text-3xl font-bold tracking-[0.5em]">積読</h1>
        <p class="text-xs mt-2 opacity-60">TSUNDOKU OLD BOOKS</p>
        <p class="text-xs mt-8 opacity-40">※検索機能はありません。<br>運命の一冊を見つけてください。</p>
    </header>

    <main class="bookshelf" id="shelf">
        <!-- JSで本を大量生成 -->
    </main>

    <!-- 詳細パネル -->
    <div class="book-modal" id="detail-panel">
        <h2 class="text-xl font-bold mb-2" id="book-title">タイトル</h2>
        <p class="text-xs text-gray-500 mb-4" id="book-author">著者名</p>
        <p class="text-sm leading-relaxed" id="book-desc">
            ここに本のあらすじや、店主の気まぐれなコメントが表示されます。古書の匂いが漂ってきそうな一冊です。
        </p>
        <button class="mt-4 w-full bg-[#3e2723] text-[#fff8e1] py-2 text-xs hover:opacity-80">
            購入する
        </button>
    </div>
<section class="portfolio-context" style="max-width: 880px; margin: 32px auto; padding: 20px; border: 1px solid currentColor; background: rgba(255,255,255,.72); line-height: 1.8; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Noto Sans JP', sans-serif;">
  <h2 style="font-size: 1rem; margin: 0 0 10px;">制作意図</h2>
  <p style="margin: 0 0 8px;">古書店の迷い込むような体験を、棚の奥行きと本の選択UIで表現したサイトデモです。短い導線でも世界観を伝えることを重視しています。</p>
  <p style="margin: 0;">本の詳細、買取案内、イベント告知、オンライン在庫検索を追加すると店舗サイトとして実用化できます。</p>
</section>
<script src="script.js"></script>
</body>
</html>
